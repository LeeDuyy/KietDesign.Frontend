services:
  app:
    container_name: kiettran-app
    image: node:22-bookworm-slim
    working_dir: /app
    command: node server.js
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      # API công khai của trang quản trị (nội dung, ảnh, liên hệ). Trang quản trị lỗi/không trả lời -> landing dùng nội dung dự phòng.
      ADMIN_API_URL: https://admin.kiettran.info
    volumes:
      - ./app:/app:ro
      # Ảnh dự án nặng 1-8MB đi qua next/image -> optimizer ghi cache vào .next/cache.
      # /app mount read-only nên cache phải nằm ở volume riêng, sống sót qua các lần deploy.
      - /mnt/SourceCode/KietTranDesign-data/next-cache:/app/.next/cache
    networks:
      - edge
    restart: unless-stopped

# Không publish cổng ra host: nginx của Dylan.Plan (chiếm 80/443 trên VPS) proxy
# kiettran.info -> kiettran-app:3000 qua network `edge` dùng chung giữa hai stack.
networks:
  edge:
    external: true
    name: edge
